# Docker Compose for UBO App (Next.js + FastAPI)
# Deploy to Moon Base VPS
#
# Usage:
#   docker compose up -d --build
#
# Architecture:
#   Internet → Cloudflare → NPM → Next.js (:3000) → FastAPI (:8000)
#

services:
  # ==========================================
  # Next.js Frontend
  # ==========================================
  ubo-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubo-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://ubo-app:8000
      - NODE_ENV=production
    depends_on:
      - ubo-app
    networks:
      - ubo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # FastAPI Backend (existing - keep as-is)
  # ==========================================
  ubo-app:
    build:
      context: ../website
      dockerfile: Dockerfile
    container_name: ubo-app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../website/.env.docker
    environment:
      - DATABASE_URL=sqlite:///./data/ubo.db
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - ubo-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ubo-network

  ubo-redis:
    image: redis:7-alpine
    container_name: ubo-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - ubo-network

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local

networks:
  ubo-network:
    driver: bridge
