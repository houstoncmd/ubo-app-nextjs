version: '3.8'

services:
  ubo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubo-app-nextjs
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://ubo-api:8000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me-in-production}
      - LDAP_URL=${LDAP_URL:-ldap://ldap.example.com:389}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-cn=admin,dc=example,dc=com}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
    depends_on:
      - ubo-api
    restart: unless-stopped
    networks:
      - ubo-network

  ubo-api:
    image: python:3.11-slim
    container_name: ubo-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    networks:
      - ubo-network

networks:
  ubo-network:
    driver: bridge
